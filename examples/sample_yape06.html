<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="description" content="A JavaScript Computer Vision Library">
        <title>JSFeatNext - JavaScript Computer Vision Library.</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Droid+Sans:regular,bold|Inconsolata|PT+Sans:400,700">
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/jsfeat.css">

    </head>
    <body>
            <video id="webcam" width="640" height="480" style="display:none;"></video>
            <div style=" width:640px;height:480px;margin: 10px auto;">
                <canvas id="canvas" width="640" height="480"></canvas>
                <div id="no_rtc" class="alert alert-error" style="display:none;"></div>
                <div id="log" class="alert alert-info"></div>
            </div>

        <script type="text/javascript" src="js/dat.gui.min.js"></script>
        <!-- ES module example: serve over http:// (e.g. `npx serve .`), not file:// -->
        <script type="module">

    import jsfeatNext from '../dist/jsfeatNext.mjs';
        import { loadCamera, stopCamera, renderCorners, showCameraError } from './js/demo-utils.mjs';
        import { profiler } from './js/profiler.mjs';

        const WIDTH = 640, HEIGHT = 480;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const stat = new profiler();

            let gui, options;
            var img_u8, corners;

            var demo_opt = function(){
                this.lap_thres = 30;
                this.eigen_thres = 25;
            }

            function demo_app(videoWidth, videoHeight) {
                ctx.fillStyle = "rgb(0,255,0)";
                ctx.strokeStyle = "rgb(0,255,0)";

                img_u8 = new jsfeatNext.matrix_t(640, 480, jsfeatNext.U8_t | jsfeatNext.C1_t);

                corners = [];
                var i = 640*480;
                while(--i >= 0) {
                    corners[i] = new jsfeatNext.keypoint_t(0,0,0,0);
                }

                options = new demo_opt();
                gui = new dat.GUI();

                gui.add(options, "lap_thres", 1, 100);
                gui.add(options, "eigen_thres", 1, 100);

                stat.add("grayscale");
                stat.add("box blur");
                stat.add("yape06");
            }

            function tick() {
                requestAnimationFrame(tick);
                stat.new_frame();
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, 640, 480);
                    var imageData = ctx.getImageData(0, 0, 640, 480);

                    stat.start("grayscale");
                    jsfeatNext.imgproc.grayscale(imageData.data, 640, 480, img_u8);
                    stat.stop("grayscale");

                    stat.start("box blur");
                    jsfeatNext.imgproc.box_blur_gray(img_u8, img_u8, 2, 0);
                    stat.stop("box blur");

                    jsfeatNext.yape06.laplacian_threshold = options.lap_thres|0;
                    jsfeatNext.yape06.min_eigen_value_threshold = options.eigen_thres|0;

                    stat.start("yape06");
                    var count = jsfeatNext.yape06.detect(img_u8, corners);
                    stat.stop("yape06");

                    // render result back to canvas
                    var data_u32 = new Uint32Array(imageData.data.buffer);
                    renderCorners(corners, count, data_u32, 640);

                    ctx.putImageData(imageData, 0, 0);

                    log.innerHTML = stat.log();
                }
            }

            
            try {
            await loadCamera(video);
            demo_app();
            requestAnimationFrame(tick);
        } catch (error) {
            showCameraError();
            console.error(error);
        }

        window.addEventListener('unload', () => stopCamera(video));
        </script>
    </body>
</html>
