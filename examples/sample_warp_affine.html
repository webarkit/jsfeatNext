<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="description" content="A JavaScript Computer Vision Library">
        <title>JSFeatNext - JavaScript Computer Vision Library.</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Droid+Sans:regular,bold|Inconsolata|PT+Sans:400,700">
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/jsfeat.css">

    </head>
    <body>
            <video id="webcam" width="640" height="480" style="display:none;"></video>
            <div style=" width:640px;height:480px;margin: 10px auto;">
                <canvas id="canvas" width="640" height="480"></canvas>
                <div id="no_rtc" class="alert alert-error" style="display:none;"></div>
                <div id="log" class="alert alert-info"></div>
            </div>

        <!-- ES module example: serve over http:// (e.g. `npx serve .`), not file:// -->
        <script type="module">

        import jsfeatNext from '../dist/jsfeatNext.mjs';
        import { loadCamera, stopCamera, showCameraError } from './js/demo-utils.mjs';
        import { profiler } from './js/profiler.mjs';

        const WIDTH = 640, HEIGHT = 480;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const stat = new profiler();

            var img_u8, img_u8_warp,mat_affine;

            function demo_app(videoWidth, videoHeight) {
                ctx.fillStyle = "rgb(0,255,0)";
                ctx.strokeStyle = "rgb(0,255,0)";

                img_u8 = new jsfeatNext.matrix_t(640, 480, jsfeatNext.U8_t | jsfeatNext.C1_t);
                img_u8_warp = new jsfeatNext.matrix_t(640, 480, jsfeatNext.U8_t | jsfeatNext.C1_t);
                mat_affine = new jsfeatNext.matrix_t(3, 2, jsfeatNext.F32_t | jsfeatNext.C1_t);

                mat_affine.data[0] = 1.1548494156391083;
                mat_affine.data[1] = 0.4783542904563622;
                mat_affine.data[2] = -164.3568427140416;
                mat_affine.data[3] = -0.4783542904563622;
                mat_affine.data[4] = 1.1548494156391083;
                mat_affine.data[5] = 115.90951319264985;

                stat.add("grayscale");
                stat.add("warp affine");
            }

            function tick() {
                requestAnimationFrame(tick);
                stat.new_frame();
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, 640, 480);
                    var imageData = ctx.getImageData(0, 0, 640, 480);

                    stat.start("grayscale");
                    jsfeatNext.imgproc.grayscale(imageData.data, 640, 480, img_u8);
                    stat.stop("grayscale");

                    stat.start("warp affine");
                    jsfeatNext.imgproc.warp_affine(img_u8, img_u8_warp, mat_affine, 0);
                    stat.stop("warp affine");

                    // render result back to canvas
                    var data_u32 = new Uint32Array(imageData.data.buffer);
                    var alpha = (0xff << 24);
                    var i = img_u8_warp.cols*img_u8_warp.rows, pix = 0;
                    while(--i >= 0) {
                        pix = img_u8_warp.data[i];
                        data_u32[i] = alpha | (pix << 16) | (pix << 8) | pix;
                    }

                    ctx.putImageData(imageData, 0, 0);

                    log.innerHTML = stat.log();
                }
            }

            try {
            await loadCamera(video);
            demo_app();
            requestAnimationFrame(tick);
        } catch (error) {
            showCameraError();
            console.error(error);
        }

        window.addEventListener('unload', () => stopCamera(video));
        </script>
    </body>
</html>
