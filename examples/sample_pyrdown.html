<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="description" content="A JavaScript Computer Vision Library">
        <title>JSFeatNext - JavaScript Computer Vision Library.</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Droid+Sans:regular,bold|Inconsolata|PT+Sans:400,700">
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/jsfeat.css">

    </head>
    <body>
            <video id="webcam" width="640" height="480" style="display:none;"></video>
            <div style=" width:640px;height:480px;margin: 10px auto;">
                <canvas id="canvas" width="640" height="480"></canvas>
                <div id="no_rtc" class="alert alert-error" style="display:none;"></div>
                <div id="log" class="alert alert-info"></div>
            </div>

        <!-- ES module example: serve over http:// (e.g. `npx serve .`), not file:// -->
        <script type="module">

            import jsfeatNext from '../dist/jsfeatNext.mjs';
        import { loadCamera, stopCamera, renderMonoImage, showCameraError } from './js/demo-utils.mjs';
        import { profiler } from './js/profiler.mjs';

        const WIDTH = 640, HEIGHT = 480;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const stat = new profiler();

            var img_pyr;

            function demo_app(videoWidth, videoHeight) {
                ctx.fillStyle = "rgb(0,255,0)";
                ctx.strokeStyle = "rgb(0,255,0)";

                img_pyr = new jsfeatNext.pyramid_t(4);
                img_pyr.allocate(640, 480, jsfeatNext.U8_t | jsfeatNext.C1_t);

                stat.add("grayscale");
                stat.add("pyrdown");
            }

            function tick() {
                requestAnimationFrame(tick);
                stat.new_frame();
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, 640, 480);
                    var imageData = ctx.getImageData(0, 0, 640, 480);

                    stat.start("grayscale");
                    jsfeatNext.imgproc.grayscale(imageData.data, 640, 480, img_pyr.data[0]);
                    stat.stop("grayscale");

                    stat.start("pyrdown");
                    // you do the same by executing img_pyr.build(img_pyr.data[0], true);
                    var i = 2, a = img_pyr.data[0], b = img_pyr.data[1];
                    jsfeatNext.imgproc.pyrdown(a, b);
                    for(; i < img_pyr.levels; ++i) {
                        a = b;
                        b = img_pyr.data[i];
                        jsfeatNext.imgproc.pyrdown(a, b);
                    }
                    stat.stop("pyrdown");

                    // render result back to canvas
                    var data_u32 = new Uint32Array(imageData.data.buffer);
                    for(i=0; i < img_pyr.levels; ++i){
                        renderMonoImage(img_pyr.data[i].data, data_u32, img_pyr.data[i].cols, img_pyr.data[i].rows, 640);
                    }

                    ctx.putImageData(imageData, 0, 0);

                    log.innerHTML = stat.log();
                }
            }

            
            try {
            await loadCamera(video);
            demo_app();
            requestAnimationFrame(tick);
        } catch (error) {
            showCameraError();
            console.error(error);
        }

        window.addEventListener('unload', () => stopCamera(video));
        </script>
    </body>
</html>
