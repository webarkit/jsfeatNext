<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="description" content="A JavaScript Computer Vision Library">
    <title>JSFeatNext - JavaScript Computer Vision Library.</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Droid+Sans:regular,bold|Inconsolata|PT+Sans:400,700">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/jsfeat.css">

</head>

<body>
    <video id="webcam" width="640" height="480" style="display:none;"></video>
    <div style=" width:640px;height:480px;margin: 10px auto;">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="no_rtc" class="alert alert-error" style="display:none;"></div>
        <div id="log" class="alert alert-info"></div>
    </div>

    <script type="text/javascript" src="js/dat.gui.min.js"></script>
        <!-- ES module example: serve over http:// (e.g. `npx serve .`), not file:// -->
        <script type="module">

        import jsfeatNext from '../dist/jsfeatNext.mjs';
        import { loadCamera, stopCamera, showCameraError } from './js/demo-utils.mjs';
        import { profiler } from './js/profiler.mjs';

        const WIDTH = 640, HEIGHT = 480;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const stat = new profiler();

            let gui, options;
            var curr_img_pyr, prev_img_pyr, point_count, point_status, prev_xy, curr_xy;

            var demo_opt = function () {
                this.win_size = 20;
                this.max_iterations = 30;
                this.epsilon = 0.01;
                this.min_eigen = 0.001;
            }

            function demo_app(videoWidth, videoHeight) {
                ctx.fillStyle = "rgb(0,255,0)";
                ctx.strokeStyle = "rgb(0,255,0)";

                curr_img_pyr = new jsfeatNext.pyramid_t(3);
                prev_img_pyr = new jsfeatNext.pyramid_t(3);
                curr_img_pyr.allocate(640, 480, jsfeatNext.U8_t | jsfeatNext.C1_t);
                prev_img_pyr.allocate(640, 480, jsfeatNext.U8_t | jsfeatNext.C1_t);

                point_count = 0;
                point_status = new Uint8Array(100);
                prev_xy = new Float32Array(100 * 2);
                curr_xy = new Float32Array(100 * 2);

                options = new demo_opt();
                gui = new dat.GUI();

                gui.add(options, 'win_size', 7, 30).step(1);
                gui.add(options, 'max_iterations', 3, 30).step(1);
                gui.add(options, 'epsilon', 0.001, 0.1).step(0.0025);
                gui.add(options, 'min_eigen', 0.001, 0.01).step(0.0025);

                stat.add("grayscale");
                stat.add("build image pyramid");
                stat.add("optical flow lk");
            }

            function tick() {
                requestAnimationFrame(tick);
                stat.new_frame();
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, 640, 480);
                    var imageData = ctx.getImageData(0, 0, 640, 480);

                    // swap flow data
                    var _pt_xy = prev_xy;
                    prev_xy = curr_xy;
                    curr_xy = _pt_xy;
                    var _pyr = prev_img_pyr;
                    prev_img_pyr = curr_img_pyr;
                    curr_img_pyr = _pyr;

                    stat.start("grayscale");
                    jsfeatNext.imgproc.grayscale(imageData.data, 640, 480, curr_img_pyr.data[0]);
                    stat.stop("grayscale");

                    stat.start("build image pyramid");
                    curr_img_pyr.build(curr_img_pyr.data[0], true);
                    stat.stop("build image pyramid");

                    stat.start("optical flow lk");
                    jsfeatNext.optical_flow_lk.track(prev_img_pyr, curr_img_pyr, prev_xy, curr_xy, point_count, options.win_size | 0, options.max_iterations | 0, point_status, options.epsilon, options.min_eigen);
                    stat.stop("optical flow lk");

                    prune_oflow_points(ctx);

                    log.innerHTML = stat.log() + '<br/>click to add tracking points: ' + point_count;
                }
            }

            function on_canvas_click(e) {
                var coords = canvas.relMouseCoords(e);
                if (coords.x > 0 & coords.y > 0 & coords.x < WIDTH & coords.y < HEIGHT) {
                    curr_xy[point_count << 1] = coords.x;
                    curr_xy[(point_count << 1) + 1] = coords.y;
                    point_count++;
                }
            }
            canvas.addEventListener('click', on_canvas_click, false);

            function draw_circle(ctx, x, y) {
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.fill();
            }

            function prune_oflow_points(ctx) {
                var n = point_count;
                var i = 0, j = 0;

                for (; i < n; ++i) {
                    if (point_status[i] == 1) {
                        if (j < i) {
                            curr_xy[j << 1] = curr_xy[i << 1];
                            curr_xy[(j << 1) + 1] = curr_xy[(i << 1) + 1];
                        }
                        draw_circle(ctx, curr_xy[j << 1], curr_xy[(j << 1) + 1]);
                        ++j;
                    }
                }
                point_count = j;
            }

            function relMouseCoords(event) {
                var totalOffsetX = 0, totalOffsetY = 0, canvasX = 0, canvasY = 0;
                var currentElement = this;

                do {
                    totalOffsetX += currentElement.offsetLeft - currentElement.scrollLeft;
                    totalOffsetY += currentElement.offsetTop - currentElement.scrollTop;
                } while (currentElement = currentElement.offsetParent)

                canvasX = event.pageX - totalOffsetX;
                canvasY = event.pageY - totalOffsetY;

                return { x: canvasX, y: canvasY }
            }
            HTMLCanvasElement.prototype.relMouseCoords = relMouseCoords;

            try {
            await loadCamera(video);
            demo_app();
            requestAnimationFrame(tick);
        } catch (error) {
            showCameraError();
            console.error(error);
        }

        window.addEventListener('unload', () => stopCamera(video));
    </script>
</body>

</html>
