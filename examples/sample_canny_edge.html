<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="description" content="A JavaScript Computer Vision Library">
        <title>JSFeatNext - JavaScript Computer Vision Library.</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Droid+Sans:regular,bold|Inconsolata|PT+Sans:400,700">
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/jsfeat.css">

    </head>
    <body>
            <video id="webcam" width="640" height="480" style="display:none;"></video>
            <div style=" width:640px;height:480px;margin: 10px auto;">
                <canvas id="canvas" width="640" height="480"></canvas>
                <div id="no_rtc" class="alert alert-error" style="display:none;"></div>
                <div id="log" class="alert alert-info"></div>
            </div>

        <script type="text/javascript" src="js/dat.gui.min.js"></script>
        <!-- ES module example: serve over http:// (e.g. `npx serve .`), not file:// -->
        <script type="module">

        import jsfeatNext from '../dist/jsfeatNext.mjs';
        import { loadCamera, stopCamera, showCameraError } from './js/demo-utils.mjs';
        import { profiler } from './js/profiler.mjs';

        const WIDTH = 640, HEIGHT = 480;

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const stat = new profiler();

            let gui, options;
            var img_u8;

            var demo_opt = function(){
                this.blur_radius = 2;
                this.low_threshold = 20;
                this.high_threshold = 50;
            }

            function demo_app(videoWidth, videoHeight) {
                ctx.fillStyle = "rgb(0,255,0)";
                ctx.strokeStyle = "rgb(0,255,0)";

                img_u8 = new jsfeatNext.matrix_t(640, 480, jsfeatNext.U8C1_t);

                options = new demo_opt();
                gui = new dat.GUI();

                gui.add(options, 'blur_radius', 0, 4).step(1);
                gui.add(options, 'low_threshold', 1, 127).step(1);
                gui.add(options, 'high_threshold', 1, 127).step(1);

                stat.add("grayscale");
                stat.add("gauss blur");
                stat.add("canny edge");
            }

            function tick() {
                requestAnimationFrame(tick);
                stat.new_frame();
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, 640, 480);
                    var imageData = ctx.getImageData(0, 0, 640, 480);

                    stat.start("grayscale");
                    jsfeatNext.imgproc.grayscale(imageData.data, 640, 480, img_u8);
                    stat.stop("grayscale");

                    var r = options.blur_radius|0;
                    var kernel_size = (r+1) << 1;

                    stat.start("gauss blur");
                    jsfeatNext.imgproc.gaussian_blur(img_u8, img_u8, kernel_size, 0);
                    stat.stop("gauss blur");

                    stat.start("canny edge");
                    jsfeatNext.imgproc.canny(img_u8, img_u8, options.low_threshold|0, options.high_threshold|0);
                    stat.stop("canny edge");

                    // render result back to canvas
                    var data_u32 = new Uint32Array(imageData.data.buffer);
                    var alpha = (0xff << 24);
                    var i = img_u8.cols*img_u8.rows, pix = 0;
                    while(--i >= 0) {
                        pix = img_u8.data[i];
                        data_u32[i] = alpha | (pix << 16) | (pix << 8) | pix;
                    }

                    ctx.putImageData(imageData, 0, 0);

                    log.innerHTML = stat.log();
                }
            }

            try {
            await loadCamera(video);
            demo_app();
            requestAnimationFrame(tick);
        } catch (error) {
            showCameraError();
            console.error(error);
        }

        window.addEventListener('unload', () => stopCamera(video));
        </script>
    </body>
</html>
