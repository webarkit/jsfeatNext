# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: "npm" # See documentation for possible values
      directory: "/" # Location of package manifests
      # Open version-update PRs against the integration branch, not main.
      target-branch: "dev"
      schedule:
          interval: "weekly"
      groups:
          # @vitest/coverage-v8 pins its `vitest` peer to the exact same
          # version, so one-sided bumps can never install (ERESOLVE): the pair
          # has to move in a single PR (see #211 / #212).
          vitest:
              patterns:
                  - "vitest"
                  - "@vitest/*"
      ignore:
          # TypeScript 7 cannot install yet: typedoc 0.28.x (latest 0.28.20)
          # declares `typescript` peer support only up to 6.0.x, so a major
          # bump would fail with ERESOLVE and break `npm run docs`. Minor and
          # patch updates of 6.x still come through. Drop this entry once a
          # typedoc release supports TypeScript 7.
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: "github-actions"
      # Workflow files stored in the default location of `.github/workflows`. (You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
