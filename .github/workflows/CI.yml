name: CI
on:
    - push
    - pull_request

jobs:
    check-and-test:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"

            - name: Get npm cache directory
              id: npm-cache-dir
              shell: bash
              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - uses: actions/cache@v6
              id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
              with:
                  path: ${{ steps.npm-cache-dir.outputs.dir }}
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install
              run: npm ci

            - name: Format check
              run: npm run format-check

            - name: License header check
              run: npm run license-check

            # Runs the suite once, with the coverage summary printed in the log
            # (issue #123). Coverage is a gap detector here, not a gate: no
            # threshold fails the build, deliberately — see vitest.config.ts.
            - name: Test (with coverage summary)
              run: npm run test:coverage
