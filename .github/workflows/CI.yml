name: CI
on:
    - push
    - pull_request

jobs:
    check-and-test:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"

            - name: Get npm cache directory
              id: npm-cache-dir
              shell: bash
              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - uses: actions/cache@v6
              id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
              with:
                  path: ${{ steps.npm-cache-dir.outputs.dir }}
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install
              run: npm ci

            - name: Format check
              run: npm run format-check

            - name: License header check
              run: npm run license-check

            # tsconfig.json covers src/ only, because it drives vite-plugin-dts
            # and the published types/ output. This checks bench/ too, via
            # tsconfig.check.json — without it a real type error in a bench file
            # survived several PRs while `tsc -p tsconfig.json` reported clean
            # (issue #157).
            - name: Type check (src + bench)
              run: npm run typecheck

            # Collection-only: loads every bench file and runs its module-level
            # and `describe` bodies, then skips the timed callbacks. It answers
            # "do the benchmarks still work?", NOT "how fast are they" — nothing
            # here measures anything, so runner noise is irrelevant and this can
            # safely gate.
            #
            # It earns its place because bench/ is otherwise untouched by CI:
            # `npm test` only includes tests/**, so a src/ refactor could rot a
            # bench file silently. Most real breakages in this suite were exactly
            # that — undersized pools, a failed count assertion, a leaked
            # Math.random stub — and all of them live in collection-time code.
            - name: Benchmark smoke check
              run: npm run bench:smoke

            # Runs the suite once, with the coverage summary printed in the log
            # (issue #123). Coverage is a gap detector here, not a gate: no
            # threshold fails the build, deliberately — see vitest.config.mts.
            - name: Test (with coverage summary)
              run: npm run test:coverage

            # Uploads lcov to Codecov for per-PR diff coverage and trends.
            # Never fails the build: statuses are informational (codecov.yml),
            # and an upload error (e.g. token missing on a fork PR) is ignored.
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false
